name: ci
on:
  push:
  pull_request:
jobs:
  build:
    # Arch is the target platform (Omarchy); the container tracks exactly what users install.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed zig git pkgconf gtk4 libadwaita pango
      - uses: actions/checkout@v4
      - run: zig fmt --check build.zig build.zig.zon src
      - run: zig build --fetch
      - run: zig build --summary all
      - run: zig build test --summary all
